<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Compiler architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f5f5;
    --ink: #2d3142;
    --muted: #4f5d75;
    --soft: #7a8399;
    --rule: rgba(45, 49, 66, 0.12);
    --accent: #eb6c36;
    --accent-tint: rgba(235, 108, 54, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 40px 32px;
    background: var(--paper);
    color: var(--ink);
    font-family: "Geist", sans-serif;
  }
  .wrap { max-width: 1440px; margin: 0 auto; }
  .eyebrow {
    margin: 0 0 8px;
    font-family: "Geist Mono", monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(45, 49, 66, 0.40);
  }
  h1 {
    margin: 0 0 24px;
    font-family: "Instrument Serif", serif;
    font-weight: 400;
    font-size: 28px;
    letter-spacing: 0.01em;
  }
  svg { display: block; width: 100%; height: auto; }
  footer {
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--rule);
    font-family: "Geist Mono", monospace;
    font-size: 10px;
    color: rgba(45, 49, 66, 0.45);
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Claude memory compiler</p>
  <h1>Memory Compiler architecture</h1>

  <svg viewBox="0 0 1440 984" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-title arch-desc">
    <title id="arch-title">Memory Compiler architecture</title>
    <desc id="arch-desc">Claude Code hooks pass context to flush.py, which writes direct Capture Records. compile.py turns pending records plus same-day Raw Inputs into knowledge articles using two OMP models round robin. query.py reads and writes the knowledge store. materialize_records.py projects legacy daily capture entries and knowledge log run entries. The Memory Compiler Base in Obsidian reads raw inputs, knowledge, captures, and runs.</desc>

    <defs>
      <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="arrow-rev" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse">
        <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
      </marker>
      <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
      </marker>
    </defs>

    <!-- background -->
    <rect width="1440" height="984" fill="#f5f5f5"/>

    <!-- ================= connectors (drawn before nodes) ================= -->

    <!-- C1 hooks -> flush -->
    <line x1="244" y1="224" x2="352" y2="224" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- C2 flush -> records (accent) -->
    <line x1="560" y1="224" x2="668" y2="224" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- C3 records -> compile (accent) -->
    <line x1="884" y1="224" x2="992" y2="224" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

    <!-- C4 raw -> compile -->
    <line x1="1108" y1="368" x2="1108" y2="296" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- C5 session-start bus: knowledge bottom + captures bottom merge, rise into hooks bottom -->
    <path d="M 1010 672
             V 696
             Q 1010 704 1002 704
             H 156
             Q 148 704 148 696
             V 268"
          fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <path d="M 800 296 V 704" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
    <circle cx="800" cy="704" r="3" fill="#4f5d75"/>

    <!-- C6 query <-> knowledge (both directions) -->
    <line x1="1108" y1="672" x2="1108" y2="736" stroke="#4f5d75" stroke-width="1.2"
          marker-start="url(#arrow-rev)" marker-end="url(#arrow)"/>

    <!-- C7 materializer -> daily aggregates -->
    <line x1="432" y1="512" x2="432" y2="600" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- C8 materializer -> run entries -->
    <line x1="592" y1="512" x2="592" y2="600" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- C9 captures -> Base (hops over the bus at y=704) -->
    <path d="M 856 296
             V 696
             a 8 8 0 0 0 0 16
             V 760"
          fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- C10 knowledge -> Base -->
    <path d="M 1224 616
             H 1240
             Q 1248 616 1248 624
             V 848
             Q 1248 856 1240 856
             H 880"
          fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- C11 raw -> Base -->
    <path d="M 1224 400
             H 1296
             Q 1304 400 1304 408
             V 872
             Q 1304 880 1296 880
             H 880"
          fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- C12 runs -> Base (hops over the bus at y=704) -->
    <path d="M 576 672
             V 696
             a 8 8 0 0 0 0 16
             V 760"
          fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

    <!-- ================= connector labels (mask + 8px gap) =============== -->

    <!-- C1 label -->
    <rect x="274" y="204" width="48" height="12" rx="2" fill="#f5f5f5"/>
    <text x="298" y="213" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.06em">CONTEXT</text>

    <!-- C2 label -->
    <rect x="582" y="204" width="64" height="12" rx="2" fill="#f5f5f5"/>
    <text x="614" y="213" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.06em">EXTRACTS</text>

    <!-- C3 label -->
    <rect x="902" y="204" width="72" height="12" rx="2" fill="#f5f5f5"/>
    <text x="938" y="213" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="middle" letter-spacing="0.06em">SELECTED</text>

    <!-- C4 label, right of the vertical -->
    <rect x="1116" y="328" width="104" height="12" rx="2" fill="#f5f5f5"/>
    <text x="1120" y="337" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="start" letter-spacing="0.06em">SAME-DAY TAGS</text>

    <!-- C5 label, right of the riser at x=148 -->
    <rect x="156" y="472" width="152" height="16" rx="2" fill="#f5f5f5"/>
    <text x="160" y="484" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="start" letter-spacing="0.06em">FEEDS SESSION START CONTEXT</text>

    <!-- C6 label, right of the vertical -->
    <rect x="1116" y="696" width="112" height="12" rx="2" fill="#f5f5f5"/>
    <text x="1120" y="705" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="start" letter-spacing="0.06em">READS AND WRITES BACK</text>

    <!-- C7 label -->
    <rect x="440" y="548" width="64" height="12" rx="2" fill="#f5f5f5"/>
    <text x="444" y="557" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="start" letter-spacing="0.06em">CAPTURES</text>

    <!-- C8 label -->
    <rect x="600" y="548" width="40" height="12" rx="2" fill="#f5f5f5"/>
    <text x="604" y="557" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace"
          text-anchor="start" letter-spacing="0.06em">RUNS</text>

    <!-- ================= nodes =========================================== -->

    <!-- N1 Claude Code hooks (backend) -->
    <rect x="60" y="180" width="184" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="152" y="216" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">Claude Code hooks</text>
    <text x="152" y="238" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono', monospace" text-anchor="middle">session end / pre-compact</text>

    <!-- N2 flush.py (backend) -->
    <rect x="352" y="180" width="208" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="456" y="216" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">flush.py</text>
    <text x="456" y="238" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono', monospace" text-anchor="middle">claude agent sdk</text>

    <!-- N3 Direct Capture Records (focal, store) -->
    <rect x="668" y="152" width="216" height="144" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="776" y="192" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">Direct Capture Records</text>
    <text x="776" y="214" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono', monospace" text-anchor="middle">records/captures/&lt;day&gt;/</text>
    <text x="776" y="232" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono', monospace" text-anchor="middle">one atomic memory flush</text>
    <text x="776" y="250" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono', monospace" text-anchor="middle">narrative / no-op / failure</text>
    <text x="776" y="278" fill="#7a8399" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SESSION ID IS THE IDENTITY</text>

    <!-- N4 compile.py (backend) -->
    <rect x="992" y="152" width="232" height="144" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="1108" y="192" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">compile.py + dual OMP models</text>
    <text x="1108" y="214" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono', monospace" text-anchor="middle">omp -p --no-session</text>
    <text x="1108" y="232" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono', monospace" text-anchor="middle">anthropic/claude-sonnet-5</text>
    <text x="1108" y="250" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono', monospace" text-anchor="middle">openai-codex/gpt-5.6-terra</text>
    <text x="1108" y="278" fill="#7a8399" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROUND ROBIN PER RECORD</text>

    <!-- N5 Vault-root Raw Inputs (input) -->
    <rect x="992" y="368" width="232" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
    <text x="1108" y="396" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">Vault-root Raw Inputs</text>
    <text x="1108" y="416" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono', monospace" text-anchor="middle">raw/ bookmarks and clippings</text>

    <!-- N6 knowledge (store) -->
    <rect x="992" y="496" width="232" height="176" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="1108" y="528" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">knowledge/</text>
    <text x="1108" y="552" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono', monospace" text-anchor="middle">index.md + articles</text>
    <text x="1108" y="570" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono', monospace" text-anchor="middle">concepts / connections / qa</text>
    <text x="1108" y="588" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono', monospace" text-anchor="middle">log.md run entries</text>
    <text x="1108" y="620" fill="#7a8399" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LOG IS AUTHORITATIVE FOR RUNS</text>

    <!-- N7 query.py (backend) -->
    <rect x="992" y="736" width="232" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="1108" y="772" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">query.py</text>
    <text x="1108" y="794" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono', monospace" text-anchor="middle">agent sdk index-guided retrieval</text>
    <text x="1108" y="812" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono', monospace" text-anchor="middle">answers filed back to qa/</text>

    <!-- N8 materialize_records.py (backend) -->
    <rect x="400" y="400" width="240" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
    <text x="520" y="436" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">materialize_records.py</text>
    <text x="520" y="458" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono', monospace" text-anchor="middle">legacy projection refresh</text>
    <text x="520" y="486" fill="#7a8399" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DAILY AGGREGATES ARE READ-ONLY</text>

    <!-- N9 daily aggregates (store, legacy) -->
    <rect x="364" y="600" width="136" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="432" y="630" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">Daily captures</text>
    <text x="432" y="650" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono', monospace" text-anchor="middle">legacy history</text>

    <!-- N10 run entries (store, legacy) -->
    <rect x="524" y="600" width="136" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
    <text x="592" y="630" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">Run entries</text>
    <text x="592" y="650" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono', monospace" text-anchor="middle">knowledge/log.md</text>

    <!-- N11 Memory Compiler Base (focal, dashboard) -->
    <rect x="352" y="768" width="520" height="128" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
    <text x="612" y="804" fill="#2d3142" font-size="12" font-weight="600"
          font-family="'Geist', sans-serif" text-anchor="middle">Memory Compiler Base</text>
    <text x="612" y="828" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono', monospace" text-anchor="middle">Obsidian Bases view at repo root</text>
    <text x="612" y="848" fill="#4f5d75" font-size="9"
          font-family="'Geist Mono', monospace" text-anchor="middle">nine views over raw, knowledge, captures, runs</text>
    <text x="612" y="876" fill="#7a8399" font-size="8"
          font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ONE DASHBOARD FOR THE WHOLE PIPELINE</text>

    <!-- ================= legend ========================================== -->
    <line x1="32" y1="928" x2="1408" y2="928" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="32" y="948" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace"
          letter-spacing="0.14em">LEGEND</text>

    <rect x="120" y="940" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
    <text x="140" y="950" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">SCRIPT</text>

    <rect x="220" y="940" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
    <text x="240" y="950" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">FOCAL STORE / DASHBOARD</text>

    <rect x="460" y="940" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="0.8"/>
    <text x="480" y="950" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">STORE</text>

    <rect x="560" y="940" width="12" height="12" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="0.8"/>
    <text x="580" y="950" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">INPUT</text>

    <line x1="660" y1="946" x2="684" y2="946" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
    <text x="692" y="950" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">FLOW</text>

    <line x1="760" y1="946" x2="784" y2="946" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
    <text x="792" y="950" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">CAPTURE FLOW</text>
  </svg>

  <footer>Hooks write nothing themselves. flush.py owns record creation. compile.py assigns models round robin. materialize_records.py repairs hand edits to the projection.</footer>
</div>
</body>
</html>
